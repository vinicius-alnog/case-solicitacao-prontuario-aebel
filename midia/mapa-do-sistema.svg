<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-label="Arquitetura simplificada do portal">
<style>text{font-family:Arial, Helvetica, sans-serif}</style>
<rect x="0" y="0" width="1200" height="920" fill="#FFFFFF"/>
<text x="60" y="88" font-size="14" fill="#08666B" font-weight="700" letter-spacing="1.7">ARQUITETURA · SUPERFÍCIES DE ACESSO</text><text x="60" y="132" font-size="33" fill="#0F3A55" font-weight="700">Três superfícies sobre uma base única</text><text x="60" y="166" font-size="18" fill="#4A5863">Cada público entra por um roteador próprio, com postura de segurança distinta.</text><text x="60" y="191" font-size="18" fill="#4A5863">Segredos de assinatura separados: uma sessão não é aceita no lugar da outra.</text><rect x="60" y="216" width="340" height="156" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="86" y="246" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">PÚBLICO EXTERNO</text><text x="86" y="274" font-size="18" fill="#0F3A55" font-weight="700">Abertura da solicitação</text><text x="86" y="300" font-size="14" fill="#4A5863">Sem sessão. Limite de requisições por</text><text x="86" y="320" font-size="14" fill="#4A5863">origem e credencial de posse do</text><text x="86" y="340" font-size="14" fill="#4A5863">rascunho, emitida uma única vez.</text><path d="M230 372 L230 405" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M226 405 L230 412 L234 405 z" fill="#C9D8E4"/><rect x="440" y="216" width="340" height="156" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="466" y="246" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">PACIENTE OU REPRESENTANTE</text><text x="466" y="274" font-size="18" fill="#0F3A55" font-weight="700">Portal do solicitante</text><text x="466" y="300" font-size="14" fill="#4A5863">Sessão própria, emitida ao final da</text><text x="466" y="320" font-size="14" fill="#4A5863">abertura, com segredo de assinatura</text><text x="466" y="340" font-size="14" fill="#4A5863">exclusivo desse público.</text><path d="M610 372 L610 405" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M606 405 L610 412 L614 405 z" fill="#C9D8E4"/><rect x="820" y="216" width="340" height="156" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="846" y="246" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">COLABORADOR E ADMINISTRADOR</text><text x="846" y="274" font-size="18" fill="#0F3A55" font-weight="700">Área institucional</text><text x="846" y="300" font-size="14" fill="#4A5863">Sessão institucional, com segredo</text><text x="846" y="320" font-size="14" fill="#4A5863">distinto, emitida só após a validação</text><text x="846" y="340" font-size="14" fill="#4A5863">da credencial no MV.</text><path d="M990 372 L990 405" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M986 405 L990 412 L994 405 z" fill="#C9D8E4"/><rect x="60" y="412" width="1080" height="206" rx="10" fill="#F1F5F9"/><text x="84" y="444" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">CAMADA DE APLICAÇÃO</text><text x="84" y="476" font-size="21" fill="#0F3A55" font-weight="700">API Node.js / Express</text><text x="340" y="476" font-size="14.5" fill="#8A97A2">36 rotas · regra de negócio isolada em serviços</text><rect x="84" y="498" width="243" height="96" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="104" y="528" font-size="16" fill="#0F3A55" font-weight="700">Roteadores</text><text x="104" y="552" font-size="13.5" fill="#4A5863">Um por superfície de acesso,</text><text x="104" y="571" font-size="13.5" fill="#4A5863">cada um com sua postura.</text><rect x="347" y="498" width="243" height="96" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="367" y="528" font-size="16" fill="#0F3A55" font-weight="700">Controllers</text><text x="367" y="552" font-size="13.5" fill="#4A5863">Validam a requisição e</text><text x="367" y="571" font-size="13.5" fill="#4A5863">orquestram os serviços.</text><rect x="610" y="498" width="243" height="96" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="630" y="528" font-size="16" fill="#0F3A55" font-weight="700">Services</text><text x="630" y="552" font-size="13.5" fill="#4A5863">Acesso a dados, integrações</text><text x="630" y="571" font-size="13.5" fill="#4A5863">e regra de negócio.</text><rect x="873" y="498" width="243" height="96" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="893" y="528" font-size="16" fill="#0F3A55" font-weight="700">Helpers</text><text x="893" y="552" font-size="13.5" fill="#4A5863">Sessão, upload, limite por</text><text x="893" y="571" font-size="13.5" fill="#4A5863">origem e agendamento.</text><path d="M160 618 L160 649" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M156 649 L160 656 L164 649 z" fill="#C9D8E4"/><rect x="60" y="656" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="80" y="688" font-size="16" fill="#0F3A55" font-weight="700">Oracle</text><text x="80" y="712" font-size="13.5" fill="#4A5863">Solicitações, auditoria e</text><text x="80" y="731" font-size="13.5" fill="#4A5863">metadados de arquivo.</text><text x="80" y="750" font-size="13.5" fill="#4A5863">15 tabelas, 16 migrations.</text><path d="M380 618 L380 649" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M376 649 L380 656 L384 649 z" fill="#C9D8E4"/><rect x="280" y="656" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="300" y="688" font-size="16" fill="#0F3A55" font-weight="700">MV</text><text x="300" y="712" font-size="13.5" fill="#4A5863">Gestão hospitalar. Valida o</text><text x="300" y="731" font-size="13.5" fill="#4A5863">colaborador e devolve o</text><text x="300" y="750" font-size="13.5" fill="#4A5863">papel de acesso.</text><path d="M600 618 L600 649" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M596 649 L600 656 L604 649 z" fill="#C9D8E4"/><rect x="500" y="656" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="520" y="688" font-size="16" fill="#0F3A55" font-weight="700">SMTP institucional</text><text x="520" y="712" font-size="13.5" fill="#4A5863">Credenciais, andamento,</text><text x="520" y="731" font-size="13.5" fill="#4A5863">resposta disponível e aviso</text><text x="520" y="750" font-size="13.5" fill="#4A5863">prévio de vencimento.</text><path d="M820 618 L820 649" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M816 649 L820 656 L824 649 z" fill="#C9D8E4"/><rect x="720" y="656" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="740" y="688" font-size="16" fill="#0F3A55" font-weight="700">Armazenamento</text><text x="740" y="712" font-size="13.5" fill="#4A5863">Diretório fora da área</text><text x="740" y="731" font-size="13.5" fill="#4A5863">publicada, com nome de</text><text x="740" y="750" font-size="13.5" fill="#4A5863">arquivo gerado no servidor.</text><path d="M1040 618 L1040 649" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M1036 649 L1040 656 L1044 649 z" fill="#C9D8E4"/><rect x="940" y="656" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="960" y="688" font-size="16" fill="#0F3A55" font-weight="700">Rotinas agendadas</text><text x="960" y="712" font-size="13.5" fill="#4A5863">Expiração de rascunho,</text><text x="960" y="731" font-size="13.5" fill="#4A5863">janela de download e</text><text x="960" y="750" font-size="13.5" fill="#4A5863">remoção definitiva.</text><text x="60" y="832" font-size="13.5" fill="#8A97A2">Diagrama conceitual desenhado para este repositório. Não representa topologia de rede, nomes de servidor ou endereços do ambiente real.</text><text x="60" y="852" font-size="13.5" fill="#8A97A2">Um canal de tempo real complementa a área institucional, sinalizando qual solicitação já está sendo atendida por outro colaborador.</text><rect x="0" y="874" width="1200" height="46" fill="#0073A9"/><text x="60" y="902" font-size="13" fill="#FFFFFF" font-weight="700">Hospital Evangélico de Londrina · AEBEL</text><text x="1140" y="902" font-size="12.5" fill="#BEDDEF" text-anchor="end">Arquitetura pública simplificada</text>
</svg>
