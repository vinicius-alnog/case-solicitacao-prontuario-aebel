<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="Comparação entre o processo anterior e o processo digital do portal">
<style>text{font-family:Arial, Helvetica, sans-serif}</style>
<rect x="0" y="0" width="1200" height="770" fill="#FFFFFF"/>
<text x="60" y="88" font-size="14" fill="#08666B" font-weight="700" letter-spacing="1.7">VISÃO GERAL · ANTES E DEPOIS</text><text x="60" y="132" font-size="33" fill="#0F3A55" font-weight="700">Antes e depois do portal</text><text x="60" y="166" font-size="18" fill="#4A5863">A mesma solicitação, do pedido no balcão até a entrega registrada com prazo.</text><rect x="60" y="200" width="520" height="470" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="90" y="240" font-size="13" fill="#4A5863" font-weight="700" letter-spacing="1.5">ANTES</text><text x="90" y="264" font-size="14" fill="#8A97A2">processo presencial, sem registro</text><path d="M90 286 L550 286" stroke="#EBF4F9" stroke-width="1" fill="none"/><circle cx="105" cy="326" r="15" fill="#8A97A2"/><text x="105" y="331.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="138" y="324" font-size="17" fill="#0F3A55" font-weight="700">Pedido presencial ou pelo SAC</text><text x="138" y="345" font-size="14.5" fill="#4A5863">O solicitante ia até o hospital ou ligava para abrir</text><circle cx="105" cy="386" r="15" fill="#8A97A2"/><text x="105" y="391.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="138" y="384" font-size="17" fill="#0F3A55" font-weight="700">Sistema interno de acesso exclusivo</text><text x="138" y="405" font-size="14.5" fill="#4A5863">Só o colaborador do SAME operava, nada era visto de fora</text><circle cx="105" cy="446" r="15" fill="#8A97A2"/><text x="105" y="451.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="138" y="444" font-size="17" fill="#0F3A55" font-weight="700">Prontuário localizado e anexado</text><text x="138" y="465" font-size="14.5" fill="#4A5863">Conferência de identidade feita no balcão, sem registro</text><circle cx="105" cy="506" r="15" fill="#8A97A2"/><text x="105" y="511.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="138" y="504" font-size="17" fill="#0F3A55" font-weight="700">Entrega por link no WhatsApp</text><text x="138" y="525" font-size="14.5" fill="#4A5863">Sem prazo de expiração e sem registro de quem baixou</text><circle cx="105" cy="566" r="15" fill="#8A97A2"/><text x="105" y="571.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="138" y="564" font-size="17" fill="#0F3A55" font-weight="700">Acompanhamento por telefone</text><text x="138" y="585" font-size="14.5" fill="#4A5863">Nenhuma trilha de auditoria, nenhum prazo, nenhum indicador</text><rect x="90" y="602" width="460" height="48" rx="8" fill="#F1F5F9"/><text x="108" y="634" font-size="25" fill="#0F3A55" font-weight="700">20 dias</text><text x="226" y="634" font-size="14" fill="#8A97A2">tempo médio até a entrega, antes do portal</text><rect x="620" y="200" width="520" height="470" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="650" y="240" font-size="13" fill="#08666B" font-weight="700" letter-spacing="1.5">DEPOIS</text><text x="650" y="264" font-size="14" fill="#8A97A2">portal com prazo e auditoria</text><path d="M650 286 L1110 286" stroke="#EBF4F9" stroke-width="1" fill="none"/><circle cx="665" cy="326" r="15" fill="#20B8BD"/><text x="665" y="331.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="698" y="324" font-size="17" fill="#0F3A55" font-weight="700">Solicitação aberta pela internet</text><text x="698" y="345" font-size="14.5" fill="#4A5863">Sete etapas curtas, para paciente ou representante legal</text><circle cx="665" cy="386" r="15" fill="#20B8BD"/><text x="665" y="391.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="698" y="384" font-size="17" fill="#0F3A55" font-weight="700">Identidade comprovada por anexo</text><text x="698" y="405" font-size="14.5" fill="#4A5863">O sistema confere o conteúdo real de cada arquivo enviado</text><circle cx="665" cy="446" r="15" fill="#20B8BD"/><text x="665" y="451.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="698" y="444" font-size="17" fill="#0F3A55" font-weight="700">Fila de trabalho do SAME</text><text x="698" y="465" font-size="14.5" fill="#4A5863">Conferência item a item: aprova ou devolve para correção</text><circle cx="665" cy="506" r="15" fill="#20B8BD"/><text x="665" y="511.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="698" y="504" font-size="17" fill="#0F3A55" font-weight="700">Download pelo portal, com prazo</text><text x="698" y="525" font-size="14.5" fill="#4A5863">Janela de disponibilidade definida e aviso de vencimento</text><circle cx="665" cy="566" r="15" fill="#20B8BD"/><text x="665" y="571.4" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="698" y="564" font-size="17" fill="#0F3A55" font-weight="700">Auditoria e retenção automáticas</text><text x="698" y="585" font-size="14.5" fill="#4A5863">Rotinas diárias aplicam os prazos e removem os arquivos</text><rect x="650" y="602" width="460" height="48" rx="8" fill="#F1F5F9"/><text x="668" y="634" font-size="25" fill="#08666B" font-weight="700">7 dias</text><text x="786" y="634" font-size="14" fill="#8A97A2">tempo médio apurado nos registros do sistema</text><text x="60" y="702" font-size="13.5" fill="#8A97A2">Figura desenhada para este repositório. Os tempos são referências institucionais e não reproduzem relatório do sistema em operação.</text><rect x="0" y="724" width="1200" height="46" fill="#0073A9"/><text x="60" y="752" font-size="13" fill="#FFFFFF" font-weight="700">Hospital Evangélico de Londrina · AEBEL</text><text x="1140" y="752" font-size="12.5" fill="#BEDDEF" text-anchor="end">Serviço de Arquivo Médico e Estatística</text>
</svg>
