<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Fluxo público de solicitação em etapas, recriado com dados fictícios">
<style>text{font-family:Arial, Helvetica, sans-serif}</style>
<rect x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<text x="60" y="88" font-size="14" fill="#08666B" font-weight="700" letter-spacing="1.7">TELA · ABERTURA DA SOLICITAÇÃO</text><text x="60" y="132" font-size="33" fill="#0F3A55" font-weight="700">O pedido é aberto em sete etapas</text><text x="60" y="166" font-size="18" fill="#4A5863">Fluxo público, pelo celular, sem cadastro prévio.</text><rect x="60" y="216" width="320" height="552" rx="26" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><rect x="72" y="228" width="296" height="528" rx="16" fill="#F7FBFD"/><defs><linearGradient id="acao" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3465A4"/><stop offset="100%" stop-color="#20B8BD"/></linearGradient></defs><text x="220.0" y="268" font-size="11" fill="#3465A4" font-weight="700" text-anchor="middle" letter-spacing="1.4">HOSPITAL EVANGÉLICO</text><text x="220.0" y="286" font-size="9" fill="#8A97A2" font-weight="700" text-anchor="middle" letter-spacing="1.4">DE LONDRINA</text><rect x="82" y="304" width="276" height="440" rx="14" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><rect x="96" y="328" width="24" height="5" rx="2.5" fill="#3465A4"/><rect x="128" y="328" width="24" height="5" rx="2.5" fill="#20B8BD"/><rect x="160" y="328" width="24" height="5" rx="2.5" fill="#DCE7F0"/><rect x="192" y="328" width="24" height="5" rx="2.5" fill="#DCE7F0"/><rect x="224" y="328" width="24" height="5" rx="2.5" fill="#DCE7F0"/><rect x="256" y="328" width="24" height="5" rx="2.5" fill="#DCE7F0"/><rect x="288" y="328" width="24" height="5" rx="2.5" fill="#DCE7F0"/><text x="220.0" y="358" font-size="12" fill="#08666B" font-weight="700" text-anchor="middle">Passo 2 de 7 · Documentos</text><text x="220.0" y="388" font-size="17" fill="#0F3A55" font-weight="700" text-anchor="middle">Envie seus documentos</text><text x="220.0" y="410" font-size="11.5" fill="#8A97A2" text-anchor="middle">Formatos aceitos: JPG, PNG ou PDF</text><rect x="96" y="428" width="248" height="84" rx="12" fill="#F7FBFD" stroke="#D6E3EE" stroke-width="1"/><text x="112" y="456" font-size="13" fill="#0F3A55" font-weight="700">Selfie com documento</text><text x="112" y="475" font-size="11" fill="#8A97A2">foto sua segurando o documento</text><rect x="112" y="484" width="74" height="20" rx="10.0" fill="#E4F6EC"/><text x="149.0" y="497.42" font-size="9.5" fill="#1A7A51" font-weight="700" text-anchor="middle" letter-spacing="0.6">ENVIADO</text><rect x="96" y="524" width="248" height="84" rx="12" fill="#FFFFFF" stroke="#E0B65C" stroke-width="1" stroke-dasharray="5 4"/><text x="112" y="552" font-size="13" fill="#0F3A55" font-weight="700">Documento · verso</text><text x="112" y="571" font-size="11" fill="#8A97A2">toque para enviar do celular</text><rect x="112" y="580" width="78" height="20" rx="10.0" fill="#FDF3E0"/><text x="151.0" y="593.42" font-size="9.5" fill="#8A6414" font-weight="700" text-anchor="middle" letter-spacing="0.6">PENDENTE</text><rect x="96" y="620" width="248" height="42" rx="21" fill="url(#acao)"/><text x="220.0" y="647" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Continuar</text><rect x="440" y="232" width="700" height="118" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="270" r="17" fill="#20B8BD"/><text x="478" y="275.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="512" y="276" font-size="18" fill="#0F3A55" font-weight="700">Sete etapas curtas, uma decisão por vez</text><text x="512" y="302" font-size="14.5" fill="#4A5863">A abertura é fatiada para que ninguém precise entender o formulário inteiro</text><text x="512" y="323" font-size="14.5" fill="#4A5863">antes de começar. O rascunho é retomável: fechar o navegador não perde nada.</text><rect x="440" y="368" width="700" height="118" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="406" r="17" fill="#20B8BD"/><text x="478" y="411.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="512" y="412" font-size="18" fill="#0F3A55" font-weight="700">O anexo é conferido pelo conteúdo real</text><text x="512" y="438" font-size="14.5" fill="#4A5863">O sistema lê a assinatura do arquivo em vez de confiar na extensão do nome,</text><text x="512" y="459" font-size="14.5" fill="#4A5863">porque renomear um executável para .pdf é a fraude mais barata que existe.</text><rect x="440" y="504" width="700" height="118" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="542" r="17" fill="#20B8BD"/><text x="478" y="547.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="512" y="548" font-size="18" fill="#0F3A55" font-weight="700">As pendências aparecem todas de uma vez</text><text x="512" y="574" font-size="14.5" fill="#4A5863">Devolver um erro por envio faria o solicitante voltar cinco vezes. A conferência</text><text x="512" y="595" font-size="14.5" fill="#4A5863">junta tudo o que falta e mostra numa lista só.</text><rect x="440" y="640" width="700" height="118" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="678" r="17" fill="#20B8BD"/><text x="478" y="683.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="512" y="684" font-size="18" fill="#0F3A55" font-weight="700">No fim, protocolo e credencial própria</text><text x="512" y="710" font-size="14.5" fill="#4A5863">O protocolo identifica a solicitação. A credencial de acesso é separada dele, para</text><text x="512" y="731" font-size="14.5" fill="#4A5863">que quem apenas leia o número não consiga entrar no acompanhamento.</text><text x="60" y="792" font-size="13.5" fill="#8A97A2">Tela recriada para este repositório. Não é captura do sistema em operação e não contém dado de pessoa real.</text><rect x="0" y="814" width="1200" height="46" fill="#0073A9"/><text x="60" y="842" font-size="13" fill="#FFFFFF" font-weight="700">Hospital Evangélico de Londrina · AEBEL</text><text x="1140" y="842" font-size="12.5" fill="#BEDDEF" text-anchor="end">Superfície pública, sem autenticação</text>
</svg>
