<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Portal do solicitante acompanhando o andamento, recriado com dados fictícios">
<style>text{font-family:Arial, Helvetica, sans-serif}</style>
<rect x="0" y="0" width="1200" height="820" fill="#FFFFFF"/>
<text x="60" y="88" font-size="14" fill="#08666B" font-weight="700" letter-spacing="1.7">TELA · PORTAL DO SOLICITANTE</text><text x="60" y="132" font-size="33" fill="#0F3A55" font-weight="700">O andamento fica do lado de quem pediu</text><text x="60" y="166" font-size="18" fill="#4A5863">Login próprio, criado no fim da abertura, com senha trocada no primeiro acesso.</text><rect x="60" y="216" width="320" height="512" rx="26" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><rect x="72" y="228" width="296" height="488" rx="16" fill="#F7FBFD"/><defs><linearGradient id="acao2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3465A4"/><stop offset="100%" stop-color="#20B8BD"/></linearGradient></defs><rect x="82" y="240" width="276" height="464" rx="14" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="100" y="274" font-size="13" fill="#0F3A55" font-weight="700">REQ_2026_08_22_K7M2QP</text><rect x="100" y="288" width="96" height="21" rx="10.5" fill="#E4F6EC"/><text x="148.0" y="301.92" font-size="9.5" fill="#1A7A51" font-weight="700" text-anchor="middle" letter-spacing="0.6">DISPONÍVEL</text><text x="100" y="332" font-size="11" fill="#8A97A2">Prontuário completo · aberta em 22/08</text><path d="M100 346 L340 346" stroke="#D6E3EE" stroke-width="1" fill="none"/><path d="M112 383 L112 415" stroke="#DCE7F0" stroke-width="2" fill="none"/><circle cx="112" cy="376" r="6" fill="#20B8BD"/><text x="130" y="377" font-size="12.5" fill="#0F3A55" font-weight="700">Solicitação enviada</text><text x="130" y="394" font-size="10.5" fill="#8A97A2">22/08 · 09h14</text><path d="M112 429 L112 461" stroke="#DCE7F0" stroke-width="2" fill="none"/><circle cx="112" cy="422" r="6" fill="#20B8BD"/><text x="130" y="423" font-size="12.5" fill="#0F3A55" font-weight="700">Documentação aprovada</text><text x="130" y="440" font-size="10.5" fill="#8A97A2">22/08 · 15h02</text><path d="M112 475 L112 507" stroke="#DCE7F0" stroke-width="2" fill="none"/><circle cx="112" cy="468" r="6" fill="#20B8BD"/><text x="130" y="469" font-size="12.5" fill="#0F3A55" font-weight="700">Prontuário anexado</text><text x="130" y="486" font-size="10.5" fill="#8A97A2">28/08 · 11h37</text><circle cx="112" cy="514" r="6" fill="#3465A4"/><text x="130" y="515" font-size="12.5" fill="#0F3A55" font-weight="700">Aviso de resposta enviado</text><text x="130" y="532" font-size="10.5" fill="#8A97A2">28/08 · 11h38</text><rect x="100" y="566" width="240" height="62" rx="12" fill="#F7FBFD" stroke="#D6E3EE" stroke-width="1"/><text x="116" y="592" font-size="12.5" fill="#0F3A55" font-weight="700">prontuario-completo.zip</text><text x="116" y="610" font-size="10.5" fill="#8A97A2">disponível para download até 04/09</text><rect x="100" y="640" width="240" height="40" rx="20" fill="url(#acao2)"/><text x="220.0" y="666" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Baixar prontuário</text><rect x="440" y="228" width="700" height="110" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="266" r="17" fill="#20B8BD"/><text x="478" y="271.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="512" y="272" font-size="18" fill="#0F3A55" font-weight="700">O prazo vale para os dois lados</text><text x="512" y="298" font-size="14.5" fill="#4A5863">O hospital tem prazo para responder e o solicitante tem prazo para baixar. Nenhuma</text><text x="512" y="319" font-size="14.5" fill="#4A5863">das duas contagens depende de alguém lembrar: as duas são do sistema.</text><rect x="440" y="356" width="700" height="110" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="394" r="17" fill="#20B8BD"/><text x="478" y="399.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="512" y="400" font-size="18" fill="#0F3A55" font-weight="700">O aviso de vencimento chega antes</text><text x="512" y="426" font-size="14.5" fill="#4A5863">Um e-mail de aviso prévio sai antes de a janela de download fechar, porque perder o</text><text x="512" y="447" font-size="14.5" fill="#4A5863">arquivo por desconhecer o prazo devolveria a pessoa ao balcão.</text><rect x="440" y="484" width="700" height="110" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="522" r="17" fill="#20B8BD"/><text x="478" y="527.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="512" y="528" font-size="18" fill="#0F3A55" font-weight="700">Depois do prazo, o arquivo sai do ar</text><text x="512" y="554" font-size="14.5" fill="#4A5863">A remoção é definitiva e agendada. Dado de saúde que entra tem data para sair, e</text><text x="512" y="575" font-size="14.5" fill="#4A5863">isso inclui os documentos de identidade enviados na abertura.</text><rect x="440" y="612" width="700" height="110" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><circle cx="478" cy="650" r="17" fill="#20B8BD"/><text x="478" y="655.76" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="512" y="656" font-size="18" fill="#0F3A55" font-weight="700">Cada download fica registrado</text><text x="512" y="682" font-size="14.5" fill="#4A5863">Quem baixou e quando. É exatamente o registro que o link de mensageiro não</text><text x="512" y="703" font-size="14.5" fill="#4A5863">produzia, e a razão pela qual a entrega saiu daquele canal.</text><text x="60" y="752" font-size="13.5" fill="#8A97A2">Tela recriada para este repositório. Protocolo, datas e nome de arquivo são fictícios, sem qualquer dado de pessoa real.</text><rect x="0" y="774" width="1200" height="46" fill="#0073A9"/><text x="60" y="802" font-size="13" fill="#FFFFFF" font-weight="700">Hospital Evangélico de Londrina · AEBEL</text><text x="1140" y="802" font-size="12.5" fill="#BEDDEF" text-anchor="end">Sessão do solicitante, segredo próprio</text>
</svg>
