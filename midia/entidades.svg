<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" role="img" aria-label="Modelo de dados conceitual">
<style>text{font-family:Arial, Helvetica, sans-serif}</style>
<rect x="0" y="0" width="1200" height="910" fill="#FFFFFF"/>
<text x="60" y="88" font-size="14" fill="#08666B" font-weight="700" letter-spacing="1.7">MODELO DE DADOS · ENTIDADES</text><text x="60" y="132" font-size="33" fill="#0F3A55" font-weight="700">As entidades principais do processo</text><text x="60" y="166" font-size="18" fill="#4A5863">Nomes genéricos. O esquema real do banco não está reproduzido aqui.</text><rect x="60" y="208" width="1080" height="78" rx="10" fill="#F1F5F9"/><text x="84" y="238" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">CATÁLOGOS DE DOMÍNIO</text><text x="84" y="262" font-size="13.5" fill="#8A97A2">valores fechados, mantidos no banco</text><circle cx="430" cy="245" r="3.5" fill="#20B8BD"/><text x="443" y="250" font-size="14.5" fill="#0F3A55">Situação da solicitação</text><circle cx="630" cy="245" r="3.5" fill="#20B8BD"/><text x="643" y="250" font-size="14.5" fill="#0F3A55">Tipo de solicitação</text><circle cx="810" cy="245" r="3.5" fill="#20B8BD"/><text x="823" y="250" font-size="14.5" fill="#0F3A55">Tipo de documento</text><circle cx="975" cy="245" r="3.5" fill="#20B8BD"/><text x="988" y="250" font-size="14.5" fill="#0F3A55">Ação auditável</text><path d="M600 286 L600 319" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M596 319 L600 326 L604 319 z" fill="#C9D8E4"/><rect x="60" y="326" width="340" height="212" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="86" y="356" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">ENVIADO PELO SOLICITANTE</text><text x="86" y="386" font-size="18" fill="#0F3A55" font-weight="700">Anexo enviado</text><text x="86" y="414" font-size="14" fill="#4A5863">Selfie com documento, frente e verso</text><text x="86" y="435" font-size="14" fill="#4A5863">do documento de identidade, termo</text><text x="86" y="456" font-size="14" fill="#4A5863">assinado e declarações legais. Guarda</text><text x="86" y="477" font-size="14" fill="#4A5863">o momento do envio e o resultado da</text><text x="86" y="498" font-size="14" fill="#4A5863">conferência documental.</text><rect x="430" y="326" width="340" height="212" rx="10" fill="#FFFFFF" stroke="#0073A9" stroke-width="2"/><text x="456" y="356" font-size="11.5" fill="#0073A9" font-weight="700" letter-spacing="1.2">REGISTRO CENTRAL</text><text x="456" y="386" font-size="18" fill="#0F3A55" font-weight="700">Solicitação</text><text x="456" y="414" font-size="14" fill="#4A5863">Protocolo, tipo de solicitante, situação</text><text x="456" y="435" font-size="14" fill="#4A5863">atual, prazos e o vínculo com o CPF</text><text x="456" y="456" font-size="14" fill="#4A5863">informado na abertura. É o registro que</text><text x="456" y="477" font-size="14" fill="#4A5863">as outras entidades referenciam, com</text><text x="456" y="498" font-size="14" fill="#4A5863">integridade garantida no banco.</text><rect x="800" y="326" width="340" height="212" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="826" y="356" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">ENTREGUE PELO SAME</text><text x="826" y="386" font-size="18" fill="#0F3A55" font-weight="700">Arquivo de resposta</text><text x="826" y="414" font-size="14" fill="#4A5863">O documento entregue ao solicitante,</text><text x="826" y="435" font-size="14" fill="#4A5863">com janela de disponibilidade para</text><text x="826" y="456" font-size="14" fill="#4A5863">download e data prevista de remoção</text><text x="826" y="477" font-size="14" fill="#4A5863">definitiva. Nunca é servido por URL</text><text x="826" y="498" font-size="14" fill="#4A5863">direta: todo acesso passa pela rota.</text><path d="M430 432 L409 432" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M409 428 L402 432 L409 436 z" fill="#C9D8E4"/><path d="M770 432 L791 432" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M791 428 L798 432 L791 436 z" fill="#C9D8E4"/><path d="M600 538 L600 566" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M230 566 L970 566" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M230 566 L230 597" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M226 597 L230 604 L234 597 z" fill="#C9D8E4"/><path d="M600 566 L600 597" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M596 597 L600 604 L604 597 z" fill="#C9D8E4"/><path d="M970 566 L970 597" stroke="#C9D8E4" stroke-width="1.5" fill="none"/><path d="M966 597 L970 604 L974 597 z" fill="#C9D8E4"/><rect x="60" y="604" width="340" height="214" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="86" y="634" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">SOMENTE INCLUSÃO</text><text x="86" y="664" font-size="18" fill="#0F3A55" font-weight="700">Registro de auditoria</text><text x="86" y="690" font-size="14" fill="#4A5863">A ação, o autor, o momento e a origem.</text><text x="86" y="711" font-size="14" fill="#4A5863">Nada pode ser alterado depois de</text><text x="86" y="732" font-size="14" fill="#4A5863">gravado, e tentativas recusadas</text><text x="86" y="753" font-size="14" fill="#4A5863">também entram, porque a ausência de</text><text x="86" y="774" font-size="14" fill="#4A5863">registro seria indistinguível de não</text><text x="86" y="795" font-size="14" fill="#4A5863">ter havido tentativa.</text><rect x="430" y="604" width="340" height="214" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="456" y="634" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">COMUNICAÇÃO</text><text x="456" y="664" font-size="18" fill="#0F3A55" font-weight="700">E-mail enviado</text><text x="456" y="690" font-size="14" fill="#4A5863">Credenciais de acesso, andamento,</text><text x="456" y="711" font-size="14" fill="#4A5863">resposta disponível e aviso prévio de</text><text x="456" y="732" font-size="14" fill="#4A5863">vencimento, gerados a partir de</text><text x="456" y="753" font-size="14" fill="#4A5863">templates versionados no banco, e</text><text x="456" y="774" font-size="14" fill="#4A5863">não no código, para que a equipe</text><text x="456" y="795" font-size="14" fill="#4A5863">ajuste o texto sem implantação.</text><rect x="800" y="604" width="340" height="214" rx="10" fill="#FFFFFF" stroke="#D6E3EE" stroke-width="1"/><text x="826" y="634" font-size="11.5" fill="#08666B" font-weight="700" letter-spacing="1.2">ENTREGA</text><text x="826" y="664" font-size="18" fill="#0F3A55" font-weight="700">Download registrado</text><text x="826" y="690" font-size="14" fill="#4A5863">Cada baixa do arquivo de resposta,</text><text x="826" y="711" font-size="14" fill="#4A5863">com autor e momento. É o que</text><text x="826" y="732" font-size="14" fill="#4A5863">substitui o envio por link de</text><text x="826" y="753" font-size="14" fill="#4A5863">mensageiro, que não deixava rastro</text><text x="826" y="774" font-size="14" fill="#4A5863">de quem recebeu nem de quando o</text><text x="826" y="795" font-size="14" fill="#4A5863">arquivo saiu do ar.</text><text x="60" y="842" font-size="13.5" fill="#8A97A2">Representação conceitual desenhada para este repositório. Nomes de tabela, colunas, chaves e tipos do banco real não estão reproduzidos aqui.</text><rect x="0" y="864" width="1200" height="46" fill="#0073A9"/><text x="60" y="892" font-size="13" fill="#FFFFFF" font-weight="700">Hospital Evangélico de Londrina · AEBEL</text><text x="1140" y="892" font-size="12.5" fill="#BEDDEF" text-anchor="end">15 tabelas no total</text>
</svg>
